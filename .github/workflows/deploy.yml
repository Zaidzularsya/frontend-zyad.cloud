name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.zyad.cloud/api/v1
          VITE_AUTH_MODE: bearer
          VITE_TENANT_HEADER: X-Tenant-ID
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Set release id
        id: release
        run: echo "id=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'dist,deploy'
          target: '~/deploy-tmp-frontend/${{ steps.release.outputs.id }}'

      - name: Run deploy script on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            bash ~/deploy-tmp-frontend/${{ steps.release.outputs.id }}/deploy/deploy.sh ${{ steps.release.outputs.id }}
