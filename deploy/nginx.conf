server {
  listen 80 default_server;
  listen [::]:80 default_server;

  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20M;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    # CSP (R5-S1, K7). Inventaris origin: API = 'self' + https://api.zyad.cloud (DEV: https://api.zyad.online);
    # media publik lewat backend /public/media/* (MinIO internal 127.0.0.1:9000, tidak dipanggil browser);
    # font = Google Fonts (index.html); login = Google Identity (accounts.google.com).
    # Vite dev server (HMR) membutuhkan ws:/wss: di connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.zyad.cloud https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_pass http://127.0.0.1:3000;
  }

  location ~* \.(?:js|css|woff2|png|jpg|jpeg|gif|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
